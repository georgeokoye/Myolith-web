*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

ul,ol{list-style:none}

.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand span{color:var(--fg-3);font-size:12.5px}
.sexsw{display:flex;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto}

.legend i,.tier i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.t1{background:var(--heat-1)}.t2{background:var(--heat-2)}.t3{background:var(--heat-3)}

.lib{overflow:auto;padding:4px 16px 8px 0;display:flex;flex-direction:column;gap:16px}

.kit{display:flex;flex-wrap:wrap;gap:6px}

.kit button:hover{border-color:var(--fg-3)}
.kit button[aria-pressed="true"]{background:var(--ink-btn);color:var(--ink-btn-fg);border-color:var(--ink-btn)}
.groups{display:flex;flex-direction:column;gap:18px}
.lib h2 span{font-family:var(--f-mono);font-weight:500;letter-spacing:0;margin-left:8px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.lib h2{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);margin-bottom:6px}
.lib ul{display:flex;flex-direction:column;gap:2px}
.groups button{width:100%;text-align:left;padding:9px 12px;border-radius:8px;display:flex;flex-direction:column;gap:1px;transition:background .15s}
.groups button:hover{background:var(--line-2)}
.groups button b{font-weight:600;font-size:14px}
.groups button small{font-size:12px;color:var(--fg-3)}
.groups button[aria-current="true"]{background:var(--ink-btn);color:var(--ink-btn-fg)}
.groups button[aria-current="true"] small{color:inherit;opacity:.62}

.stage{position:relative;min-width:0;min-height:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(ellipse 80% 70% at 50% 36%,var(--stage-a),var(--stage-b) 100%);display:flex;flex-direction:column}
.view{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab;transition:opacity .18s}

canvas.swap{opacity:0}
svg.labels{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.labels line{stroke:var(--fg);stroke-width:1;opacity:.55}
svg.labels circle{fill:var(--bg);stroke:var(--fg);stroke-width:1.5}
svg.labels text{font-family:var(--f-body);font-size:12px;font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--stage-a);stroke-width:4px;stroke-linejoin:round}
.hud{position:absolute;left:20px;top:18px;max-width:min(330px,62%);pointer-events:none}
.hud .ph{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:.95;text-transform:uppercase;letter-spacing:.02em}
.hud .cue{margin-top:8px;font-size:14px;color:var(--fg-2);text-wrap:pretty}
.views{position:absolute;right:16px;top:16px;display:flex;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px}
.views button{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--fg-2)}
.views button[aria-pressed="true"]{background:var(--ink-btn);color:var(--ink-btn-fg)}
.hint{position:absolute;right:18px;bottom:12px;font-size:11.5px;color:var(--fg-3);pointer-events:none}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--fg-2)}

.bar{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--panel) 82%,transparent)}
.play{flex:none;width:42px;height:42px;border-radius:50%;background:var(--ink-btn);color:var(--ink-btn-fg);display:grid;place-items:center}
.play svg{width:16px;height:16px;fill:currentColor}
.tl{flex:1;min-width:0;display:flex;gap:4px;cursor:pointer;touch-action:none;padding-block:4px}
.seg{min-width:0;display:flex;flex-direction:column;gap:6px}
.seg span{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.on span{color:var(--fg)}
.seg em{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.seg em i{display:block;height:100%;width:0;background:var(--fg)}
.seg.work em i{background:var(--heat-1)}
.speed{flex:none;font-family:var(--f-mono);font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;min-width:58px;font-variant-numeric:tabular-nums}

.info{overflow:auto;padding:4px 0 8px 28px;display:flex;flex-direction:column;gap:22px;min-width:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
.info h1{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:.95;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;margin-top:6px}
.blurb{margin-top:10px;color:var(--fg-2);font-size:15px;max-width:60ch;text-wrap:pretty}
.info h3{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);margin-bottom:10px}
.tiers{display:flex;flex-direction:column;gap:10px}
.tier{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;align-items:baseline}
.tier>span{font-size:12.5px;color:var(--fg-2);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip);font-size:12.5px;font-weight:500;transition:border-color .15s}
.chips button:hover,.chips button:focus-visible{border-color:var(--fg)}
.rx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.rx div{padding:11px 12px;border-left:1px solid var(--line);min-width:0}
.rx div:first-child{border-left:0}
.rx dt{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.rx dd{margin:2px 0 0;font-family:var(--f-mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.rx dd small{font-size:11px;color:var(--fg-3);font-family:var(--f-body)}
dl{margin:0}
.fine{font-size:12px;color:var(--fg-3);margin-top:8px}
.list li{position:relative;padding-left:16px;color:var(--fg-2);margin-bottom:6px;max-width:62ch}
.list li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:1.5px;background:var(--fg-3)}
.steps li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;padding:9px 12px;border-radius:10px;color:var(--fg-2);transition:background .2s,color .2s}
.steps li b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--fg-3);padding-top:2px}
.steps li.on{background:var(--panel);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.steps li.on b{color:var(--heat-1)}
.breath{color:var(--fg-2);max-width:62ch}
.foot{font-size:11.5px;color:var(--fg-3);padding-bottom:6px;max-width:62ch}

@media (max-width:1099px){
  html,body{height:auto}
  .app{height:auto;display:flex;flex-direction:column;gap:14px;padding-block:0 24px}
  .top{padding-block:14px 0}
  .lib{gap:12px;padding:0;overflow:visible}
  .groups{flex-direction:row;gap:20px;overflow-x:auto;overflow-y:hidden;padding-bottom:6px}
  .lib section{flex:none}
  .lib ul{flex-direction:row;gap:6px}
  .groups button{width:auto;white-space:nowrap;border:1px solid var(--line);background:var(--chip);padding:7px 12px}

}
@media (max-width:520px){

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
